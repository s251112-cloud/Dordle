<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dordle - 2 Words at Once</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background-color: #121213;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 15px 10px;
      user-select: none;
    }

    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 2.2rem; letter-spacing: 3px; color: #ffffff; }

    #message {
      height: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #d7dedc;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Dual Grid Layout */
    #boards-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      max-width: 100%;
      overflow-x: auto;
    }

    .board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 1px;
      color: #aaa;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-gap: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 5px;
    }

    .tile {
      width: 42px;
      height: 42px;
      border: 2px solid #3a3a3c;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: transform 0.1s ease, background-color 0.25s ease;
    }

    .tile.pop { transform: scale(1.08); border-color: #565758; }

    /* Tile Colors */
    .correct { background-color: #538d4e !important; border-color: #538d4e !important; color: white; }
    .present { background-color: #b59f3b !important; border-color: #b59f3b !important; color: white; }
    .absent { background-color: #3a3a3c !important; border-color: #3a3a3c !important; color: white; }

    /* Virtual Keyboard */
    #keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 500px; }
    .kb-row { display: flex; justify-content: center; gap: 4px; }
    .key {
      background-color: #818384;
      color: white;
      border: none;
      border-radius: 4px;
      height: 52px;
      flex: 1;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }
    .key-large { flex: 1.5; font-size: 0.75rem; }
    .key.correct { background-color: #538d4e; }
    .key.present { background-color: #b59f3b; }
    .key.absent { background-color: #3a3a3c; }

    /* Controls */
    #restart-btn {
      margin-top: 15px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #538d4e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
    #restart-btn:hover { background-color: #467641; }

    @media (max-width: 500px) {
      .tile { width: 34px; height: 34px; font-size: 1.2rem; }
      #boards-container { gap: 10px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>DORDLE</h1>
  </header>

  <div id="message">Solve both 5-letter words in 7 tries!</div>

  <div id="boards-container">
    <div class="board-wrapper">
      <div class="board-title" id="title-1">WORD 1</div>
      <div class="board" id="board-1"></div>
    </div>
    <div class="board-wrapper">
      <div class="board-title" id="title-2">WORD 2</div>
      <div class="board" id="board-2"></div>
    </div>
  </div>

  <div id="keyboard"></div>
  <button id="restart-btn" onclick="initGame()">PLAY AGAIN</button>

  <script>
    const WORD_POOL = ["SALET", "CRANE", "STALE", "LEASE", "CLASS", "BILLY", "SPITS", "GLASS", "LOGIC", "SMART", "CLOUD", "GRAIN", "PLANT", "SHARK", "TRAIN", "FLASH", "PRIME", "STAGE"];
    
    let target1 = "", target2 = "";
    let solved1 = false, solved2 = false;
    let currentRow = 0;
    let currentTile = 0;
    let isGameOver = false;
    let currentGuess = [];

    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restart-btn");
    const keyboard = document.getElementById("keyboard");

    const kbLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","DEL"]
    ];

    function initGame() {
      // Pick two distinct secret words
      target1 = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
      do {
        target2 = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
      } while (target1 === target2);

      solved1 = false;
      solved2 = false;
      currentRow = 0;
      currentTile = 0;
      isGameOver = false;
      currentGuess = [];

      messageEl.textContent = "Solve both 5-letter words in 7 tries!";
      document.getElementById("title-1").textContent = "WORD 1";
      document.getElementById("title-1").style.color = "#aaa";
      document.getElementById("title-2").textContent = "WORD 2";
      document.getElementById("title-2").style.color = "#aaa";
      restartBtn.style.display = "none";

      renderBoard("board-1");
      renderBoard("board-2");
      renderKeyboard();
    }

    function renderBoard(boardId) {
      const board = document.getElementById(boardId);
      board.innerHTML = "";
      for (let r = 0; r < 7; r++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `${boardId}-tile-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }

    function renderKeyboard() {
      keyboard.innerHTML = "";
      kbLayout.forEach(rowKeys => {
        const row = document.createElement("div");
        row.className = "kb-row";
        rowKeys.forEach(key => {
          const btn = document.createElement("button");
          btn.textContent = key;
          btn.id = `key-${key}`;
          btn.className = `key ${key.length > 1 ? 'key-large' : ''}`;
          btn.onclick = () => handleInput(key);
          row.appendChild(btn);
        });
        keyboard.appendChild(row);
      });
    }

    window.addEventListener("keydown", (e) => {
      if (isGameOver) return;
      if (e.key === "Enter") handleInput("ENTER");
      else if (e.key === "Backspace") handleInput("DEL");
      else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key.toUpperCase());
    });

    function handleInput(key) {
      if (isGameOver) return;

      if (key === "DEL") {
        if (currentTile > 0) {
          currentTile--;
          currentGuess.pop();
          updateTileText("", false);
        }
      } else if (key === "ENTER") {
        if (currentTile === 5) {
          submitGuess();
        } else {
          messageEl.textContent = "Not enough letters!";
        }
      } else if (currentTile < 5 && key.length === 1) {
        currentGuess.push(key);
        updateTileText(key, true);
        currentTile++;
      }
    }

    function updateTileText(letter, isPop) {
      if (!solved1) {
        const tile1 = document.getElementById(`board-1-tile-${currentRow}-${currentTile}`);
        tile1.textContent = letter;
        if (isPop) tile1.classList.add("pop");
        else tile1.classList.remove("pop");
      }
      if (!solved2) {
        const tile2 = document.getElementById(`board-2-tile-${currentRow}-${currentTile}`);
        tile2.textContent = letter;
        if (isPop) tile2.classList.add("pop");
        else tile2.classList.remove("pop");
      }
    }

    function evaluateWord(guessWord, targetWord) {
      const targetArr = targetWord.split("");
      const status = Array(5).fill("absent");

      for (let i = 0; i < 5; i++) {
        if (guessWord[i] === targetArr[i]) {
          status[i] = "correct";
          targetArr[i] = null;
        }
      }

      for (let i = 0; i < 5; i++) {
        if (status[i] !== "correct" && targetArr.includes(guessWord[i])) {
          status[i] = "present";
          targetArr[targetArr.indexOf(guessWord[i])] = null;
        }
      }

      return status;
    }

    function applyStatuses(boardId, statuses) {
      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`${boardId}-tile-${currentRow}-${i}`);
        tile.classList.add(statuses[i]);
      }
    }

    function submitGuess() {
      const guessStr = currentGuess.join("");

      // Evaluate Word 1 if not solved yet
      if (!solved1) {
        const status1 = evaluateWord(guessStr, target1);
        applyStatuses("board-1", status1);
        if (guessStr === target1) {
          solved1 = true;
          document.getElementById("title-1").textContent = "SOLVED! ✓";
          document.getElementById("title-1").style.color = "#538d4e";
        }
      }

      // Evaluate Word 2 if not solved yet
      if (!solved2) {
        const status2 = evaluateWord(guessStr, target2);
        applyStatuses("board-2", status2);
        if (guessStr === target2) {
          solved2 = true;
          document.getElementById("title-2").textContent = "SOLVED! ✓";
          document.getElementById("title-2").style.color = "#538d4e";
        }
      }

      // Win Condition
      if (solved1 && solved2) {
        messageEl.innerHTML = "🎉 Incredible! You solved both words!";
        endGame();
        return;
      }

      // Lose Condition
      if (currentRow === 6) {
        messageEl.innerHTML = `❌ Game Over! Words were: <b style="color:#ff5555">${target1}</b> & <b style="color:#ff5555">${target2}</b>`;
        endGame();
        return;
      }

      // Advance to next row
      currentRow++;
      currentTile = 0;
      currentGuess = [];
      messageEl.textContent = "";
    }

    function endGame() {
      isGameOver = true;
      restartBtn.style.display = "block";
    }

    initGame();
  </script>
</body>
</html>
